name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm init -y
      - run: npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - run: npx cap init "Dompetin" com.gabs.dompetin --web-dir www
      - run: npx cap add android
      - run: npx cap sync android
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n<application#' android/app/src/main/AndroidManifest.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: Dompetin-APK, path: android/app/build/outputs/apk/debug/app-debug.apk}
