name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: mkdir -p www; test -f www/index.html || cp index.html www/index.html
      - run: ls -R www
      - run: npm init -y
      - run: npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
      - run: npx cap init "Dompetin" com.gabs.dompetin --web-dir www
      - run: npx cap add android
      - run: npx cap sync android
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n<application#' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's|<item name="windowNoTitle">true</item>|&<item name="android:navigationBarColor">#000000</item><item name="android:statusBarColor">#000000</item><item name="android:windowLightNavigationBar">false</item><item name="android:windowLightStatusBar">false</item>|' android/app/src/main/res/values/styles.xml
      - run: test -f icons.zip && unzip -o icons.zip -d android/app/src/main/res || echo tanpa-ikon-kustom
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: Dompetin-APK, path: android/app/build/outputs/apk/debug/app-debug.apk}
